# Normal operating ranges per sensor (from the use case statement)
normal_ranges:
  reaction_temperature_celsius: [75.0, 100.0]
  vessel_pressure_bar: [2.0, 3.0]
  refractive_index: [1.43, 1.49]
  density_g_cm3: [0.80, 0.90]
  ph_level: [5.0, 6.0]
  mixing_torque_nm: [9.0, 12.5]
  mass_flow_rate_kg_h: [380.0, 520.0]
  stability_months: [18.0, 30.0]
