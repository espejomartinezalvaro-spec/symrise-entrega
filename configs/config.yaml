# Single source of truth for paths, domain knowledge and reproducibility settings.
# Domain ranges come from the case statement.

seed: 42

paths:
  raw_data: data/raw/fragrance_stability_dataset_corrupted_20260601_161558.csv
  raw_data_sha256: 870204af5b3e6ab0f320f3699b40624dd7ad20401eff70668723e91e762f2d36
  processed_dir: data/processed
  figures_dir: reports/figures

target: stability_months

# Columns derived from the target -> never used as features (leakage)
